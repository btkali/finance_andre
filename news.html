<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<link rel="manifest" href="/manifest.webmanifest">
<title>Rassegna mercati</title>
<style>
  :root{
    --bg:#0b0f16; --panel:#131a24; --panel2:#182130; --line:#243044;
    --txt:#e6edf7; --dim:#8496ad; --accent:#4f8cff;
    --i5:#ff5470; --i4:#ffb020; --i3:#4f8cff; --i2:#6b7f99; --i1:#4a5a70;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto;padding:16px 16px 60px}

  nav{
    display:flex;gap:8px;margin-bottom:18px;
    padding:env(safe-area-inset-top) 0 0;
  }
  nav a{
    flex:1;text-align:center;padding:11px 8px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);
    color:var(--dim);text-decoration:none;font-weight:600;font-size:14px;
  }
  nav a.on{background:var(--accent);border-color:var(--accent);color:#fff}

  header h1{font-size:22px;margin:0 0 6px;letter-spacing:-.3px}
  .meta{color:var(--dim);font:12px var(--mono);margin-bottom:18px}

  .summary{
    background:linear-gradient(160deg,#16243a,#131a24);
    border:1px solid #2a4368;border-radius:14px;padding:17px 18px;margin-bottom:22px;
  }
  .summary h2{
    font:600 11px var(--mono);color:var(--accent);margin:0 0 10px;
    text-transform:uppercase;letter-spacing:1px;
  }
  .summary p{margin:0;font-size:15.5px;line-height:1.65}

  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .filters button{
    background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:8px 13px;border-radius:20px;font:600 12px system-ui;cursor:pointer;
  }
  .filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .art{
    background:var(--panel);border:1px solid var(--line);border-left-width:4px;
    border-radius:11px;padding:14px 15px;margin-bottom:11px;
  }
  .art[data-i="5"]{border-left-color:var(--i5)}
  .art[data-i="4"]{border-left-color:var(--i4)}
  .art[data-i="3"]{border-left-color:var(--i3)}
  .art[data-i="2"]{border-left-color:var(--i2)}
  .art[data-i="1"]{border-left-color:var(--i1)}

  .art .top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
  .imp{
    font:700 10px var(--mono);padding:3px 8px;border-radius:5px;
    letter-spacing:.5px;white-space:nowrap;
  }
  .art[data-i="5"] .imp{background:rgba(255,84,112,.16);color:var(--i5)}
  .art[data-i="4"] .imp{background:rgba(255,176,32,.16);color:var(--i4)}
  .art[data-i="3"] .imp{background:rgba(79,140,255,.16);color:var(--i3)}
  .art[data-i="2"] .imp,.art[data-i="1"] .imp{background:var(--panel2);color:var(--dim)}
  .cat{font:600 10px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
  .fonte{font:11px var(--mono);color:var(--dim);margin-left:auto}

  .sintesi{font-size:15.5px;line-height:1.6;margin:0 0 9px}
  .titolo{
    display:block;font-size:12.5px;color:var(--dim);text-decoration:none;
    line-height:1.5;border-top:1px solid var(--line);padding-top:9px;
  }
  .titolo:hover{color:var(--accent)}
  .titolo::after{content:" ↗";opacity:.6}

  .empty{
    text-align:center;color:var(--dim);padding:50px 20px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
  }
  .archivio{margin-top:30px}
  .archivio h3{font:600 11px var(--mono);color:var(--dim);text-transform:uppercase;
    letter-spacing:1px;margin:0 0 10px}
  .archivio a{
    display:block;padding:11px 13px;background:var(--panel);
    border:1px solid var(--line);border-radius:9px;margin-bottom:7px;
    color:var(--txt);text-decoration:none;font:13px var(--mono);
  }
  .archivio a:hover{border-color:var(--accent)}

  @media(max-width:520px){
    .wrap{padding:12px 12px 50px}
    header h1{font-size:19px}
    .summary p{font-size:15px}
    .art{padding:13px}
  }
</style>
</head>
<body>
<div class="wrap">

  <nav>
    <a href="/">Trading</a>
    <a href="/notizie" class="on">Rassegna</a>
  </nav>

  <header>
    <h1>Rassegna mercati</h1>
    <div class="meta" id="meta">caricamento…</div>
  </header>

  <div id="summary"></div>
  <div class="filters" id="filters"></div>
  <div id="lista"></div>

  <div class="archivio">
    <h3>Rassegne precedenti</h3>
    <div id="archivio"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let TUTTE = [], filtro = 0;

const ETICHETTA = {5:'CRITICA', 4:'ALTA', 3:'MEDIA', 2:'BASSA', 1:'MINIMA'};
const esc = s => String(s == null ? '' : s)
  .replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function quando(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString('it-IT',
    {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
}

function render() {
  const viste = filtro ? TUTTE.filter(n => n.importanza >= filtro) : TUTTE;
  if (!viste.length) {
    $('lista').innerHTML = '<div class="empty">Nessuna notizia a questo livello.</div>';
    return;
  }
  $('lista').innerHTML = viste.map(n => `
    <article class="art" data-i="${n.importanza || 3}">
      <div class="top">
        <span class="imp">${ETICHETTA[n.importanza] || 'MEDIA'}</span>
        <span class="cat">${esc((n.categoria || '').replace(/_/g, ' '))}</span>
        <span class="fonte">${esc(n.fonte)}${n.diffusione > 1
          ? ' · ' + n.diffusione + ' fonti' : ''}</span>
      </div>
      <p class="sintesi">${esc(n.sintesi || n.titolo)}</p>
      ${n.link ? `<a class="titolo" href="${esc(n.link)}" target="_blank"
        rel="noopener">${esc(n.titolo)}</a>` : ''}
    </article>`).join('');
}

function renderFiltri() {
  const conta = l => TUTTE.filter(n => n.importanza >= l).length;
  const opzioni = [
    {v:0, t:'Tutte (' + TUTTE.length + ')'},
    {v:4, t:'Solo rilevanti (' + conta(4) + ')'},
    {v:5, t:'Solo critiche (' + conta(5) + ')'}
  ];
  $('filters').innerHTML = opzioni.map(o =>
    `<button data-v="${o.v}" class="${filtro === o.v ? 'on' : ''}">${o.t}</button>`
  ).join('');
  $('filters').querySelectorAll('button').forEach(b =>
    b.onclick = () => { filtro = +b.dataset.v; renderFiltri(); render(); });
}

/* ---------- da dove arrivano i dati ----------
   Come la dashboard: sul PC c'e' l'API, su GitHub Pages c'e' solo il file
   pubblicato dal motore. Sul sito statico l'archivio contiene solo le voci
   presenti nell'ultima fotografia, e le rassegne vecchie non si aprono:
   servirebbe una richiesta al database, che li' non c'e'. */
const RAMO_DATI = 'dati';          /* lo riscrive deploy_github.py se lo cambi */
let FONTE = null;

function urlDatiStatici() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  if (m) {
    const repo = location.pathname.split('/').filter(Boolean)[0] || location.hostname;
    return `https://raw.githubusercontent.com/${m[1]}/${repo}/${RAMO_DATI}/notizie.json`;
  }
  return 'notizie.json';
}

async function daFile() {
  const d = await fetch(urlDatiStatici() + '?t=' + Date.now(),
                        { cache: 'no-store' }).then(r => r.json());
  return d;
}

async function carica(id) {
  try {
    let d;
    if (FONTE !== 'file') {
      try {
        d = await fetch(id ? '/api/news/' + id : '/api/news').then(r => r.json());
        FONTE = 'api';
      } catch (e) { FONTE = 'file'; }
    }
    if (FONTE === 'file') {
      d = (await daFile()).notizie || { digest: null, notizie: [] };
    }

    if (!d.digest) {
      $('meta').textContent = 'nessuna rassegna disponibile';
      $('summary').innerHTML = '';
      $('lista').innerHTML = `<div class="empty">
        Nessuna rassegna ancora generata.<br><br>
        La prima arriva automaticamente al prossimo orario previsto
        (9:00, 13:00 o 21:30).</div>`;
      return;
    }

    const g = d.digest;
    $('meta').textContent =
      `${g.fascia} · ${quando(g.creato)} · ${g.n_notizie} notizie · ${g.modello}`;
    $('summary').innerHTML = g.panoramica
      ? `<div class="summary"><h2>In sintesi</h2><p>${esc(g.panoramica)}</p></div>`
      : '';

    TUTTE = d.notizie || [];
    renderFiltri();
    render();
  } catch (e) {
    $('meta').textContent = 'server non raggiungibile';
  }
}

async function caricaArchivio() {
  try {
    let lista;
    if (FONTE === 'file') {
      lista = (await daFile()).notizie_archivio || [];
    } else {
      lista = await fetch('/api/news-archivio?limit=12').then(r => r.json());
    }
    $('archivio').innerHTML = (lista || []).slice(1).map(d =>
      `<a href="#" data-id="${d.id}">${quando(d.creato)} · ${esc(d.fascia)}
        · ${d.n_notizie} notizie</a>`).join('')
      || '<div class="empty" style="padding:20px">Nessuna rassegna precedente.</div>';
    $('archivio').querySelectorAll('a[data-id]').forEach(a =>
      a.onclick = ev => { ev.preventDefault(); carica(a.dataset.id);
        window.scrollTo({top:0, behavior:'smooth'}); });
  } catch (e) { /* archivio non disponibile: non è bloccante */ }
}

carica().then(caricaArchivio);
setInterval(() => { carica(); caricaArchivio(); }, 120000);
</script>
</body>
</html>
